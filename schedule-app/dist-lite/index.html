    <!-- Theme init: must run before first paint so a saved dark preference
         never flashes the light UI. Mirrors useTheme() in App.jsx and the full
         app's index.html (shared localStorage key). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pgp2.theme");
          var dark = t === "dark" || ((t === "system" || !t) && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.dataset.theme = "dark";
        } catch (e) { /* no-op */ }
      })();
    </script>

    <!-- Preconnect to external origins to reduce latency -->
    <link rel="preconnect" href="https://clerk.pgp2.termflow.tech" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Async (non-blocking) Google Fonts load -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" onload="this.rel='stylesheet'" />

    <link rel="preconnect" href="https://fzhfbttlbfpnwhempyav.supabase.co" />

    <!-- Preload today's hero backdrop (mirrors HeroBackdrop's even/odd-day swap
         in Hero.jsx) so it paints with the hero instead of after it -->
    <script>
      (function () {
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.href = new Date().getDate() % 2 === 0
          ? "/premium_hero_backdrop_v2.webp"
          : "/premium_hero_backdrop_v3.webp";
        document.head.appendChild(l);
      })();
    </script>

  <style>/* critical */
/* ── Critical CSS — inlined into index.html at build time ──
   Covers ONLY what is needed before the first paint:
   - CSS custom properties (tokens)
   - html/body background so there is no white flash
   - .loading-screen and .loading-label for the static boot splash
   Everything else is in styles.css, loaded asynchronously. */

/* ── CSS custom properties (Houdini @property for animated gradients) ── */
@property --bg-start {
  syntax: '<color>';
  inherits: false;
  initial-value: #F3F1EA;
}

@property --bg-mid {
  syntax: '<color>';
  inherits: false;
  initial-value: #F0EDE4;
}

@property --bg-end {
  syntax: '<color>';
  inherits: false;
  initial-value: #E8E5DA;
}

/* ── Design tokens ── */
:root {
  --bg: #F3F1EA;
  --surface: #ECEAE2;
  --card: #FFFFFF;
  --card-hi: #F7F5EF;
  --border: #E4E0D5;
  --border-hi: #CCC8BC;
  --text: #1A1C2A;
  --muted: #6A6E7E;
  --live: #1FA971;
  --live-dim: rgba(31, 169, 113, .08);
  --amber: #C9882B;
  --amber-dim: rgba(201, 136, 43, .13);
  --violet: #6D5BD0;
  --violet-dim: rgba(109, 91, 208, .08);
  --blue: #3B82F6;
  --danger: #C0392B;
  --amber-text: #8A5A14;
  --amber-transparent: rgba(201, 136, 43, .10);
  --ink: #15182B;
  --bone: #F3F1EA;
  --line: #E4E0D5;
  --display: 'Bricolage Grotesque', system-ui, sans-serif;
  --body: 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out-strong: cubic-bezier(0.77, 0, 0.175, 1);
}

/* ── Dark theme tokens ── */
html[data-theme="dark"] {
  --bg: #101216;
  --surface: #16181E;
  --card: #1C1F26;
  --card-hi: #22252E;
  --border: #2A2D36;
  --border-hi: #3A3E4A;
  --text: #E8E6DF;
  --muted: #9BA0AE;
  --live: #2FC68A;
  --live-dim: rgba(47, 198, 138, .14);
  --amber: #E0A044;
  --amber-dim: rgba(224, 160, 68, .16);
  --violet: #8B7AE8;
  --violet-dim: rgba(139, 122, 232, .14);
  --blue: #60A5FA;
  --danger: #F87171;
  --amber-text: #FCD34D;
  --amber-transparent: rgba(224, 160, 68, .14);
  --ink: #E8E6DF;
  --bone: #101216;
  --line: #2A2D36;
  color-scheme: dark;
}

/* ── Reset ── */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  background: var(--bone);
  overscroll-behavior-y: contain;
}

/* ── Body background gradient (prevents white/ivory flash) ── */
body {
  margin: 0;
  --bg-start: #F3F1EA;
  --bg-mid: #F0EDE4;
  --bg-end: #E8E5DA;
  background: linear-gradient(150deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

html[data-theme="dark"] body {
  --bg-start: #101216;
  --bg-mid: #0E1014;
  --bg-end: #0B0D11;
}

/* ── Boot splash (used by static HTML in index.html AND React Suspense fallback) ── */
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  min-height: 100vh;
  background: var(--bone);
}

.loading-label {
  margin: 18px 0 4px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  letter-spacing: -0.2px;
  animation: loading-fadein .5s ease .3s both;
}

@keyframes loading-fadein {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

</style>
<link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <!-- Static boot splash: painted straight from HTML so FCP doesn't wait on
         react-vendor + main.js. React's first render() replaces it. Identical to
         the full app so the two editions boot consistently. -->
    <div id="root">
      <main class="loading-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh">
        <svg width="96" height="96" viewBox="0 0 240 240" role="img" aria-label="Loading…" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="boot-ring" x1="0" y1="0" x2="0.3" y2="1">
              <stop offset="0" stop-color="#EBD9FF" /><stop offset="0.5" stop-color="#A855F7" /><stop offset="1" stop-color="#6D28D9" />
            </linearGradient>
            <linearGradient id="boot-arrow" x1="0.1" y1="0" x2="0.9" y2="1">
              <stop offset="0" stop-color="#FBF8FF" /><stop offset="0.5" stop-color="#B98CF7" /><stop offset="1" stop-color="#7C3AED" />
            </linearGradient>
            <linearGradient id="boot-arrowDark" x1="0.1" y1="0" x2="0.9" y2="1">
              <stop offset="0" stop-color="#A77EE0" /><stop offset="1" stop-color="#4C1D95" />
            </linearGradient>
            <linearGradient id="boot-flow" x1="0.2" y1="0" x2="0.45" y2="1">
              <stop offset="0" stop-color="#5B21B6" /><stop offset="0.5" stop-color="#8B3DF5" /><stop offset="1" stop-color="#C77DFF" />
            </linearGradient>
            <linearGradient id="boot-flowHi" x1="0.2" y1="0" x2="0.45" y2="1">
              <stop offset="0" stop-color="#8B3DF5" /><stop offset="1" stop-color="#E3C2FF" />
            </linearGradient>
          </defs>
          <style>
            .boot-mark { transform-box: view-box; transform-origin: 120px 120px; animation: boot-breathe 2.6s ease-in-out infinite; }
            @keyframes boot-breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.028) } }
            @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; } }
          </style>
          <ellipse cx="120" cy="128" rx="55" ry="66" fill="#8B3DF5" opacity="0.24" />
          <g class="boot-mark">
            <circle cx="120" cy="120" r="92" fill="none" stroke="url(#boot-ring)" stroke-width="7" />
            <path fill="url(#boot-flow)" d="M120,200 C 140,192 148,168 136,146 C 128,131 121,127 120,122 C 118,130 112,134 106,146 C 112,150 110,158 104,164 C 110,168 108,178 100,184 C 108,192 113,197 120,200 Z" />
            <path fill="url(#boot-flowHi)" d="M120,194 C 132,188 137,170 129,154 C 124,143 120,138 120,134 C 117,142 112,148 110,158 C 107,170 110,186 120,194 Z" />
            <g transform="translate(118,100) rotate(42)">
              <path d="M0,-50 L25,40 L0,18 L-25,40 Z" fill="url(#boot-arrow)" />
              <path d="M0,-50 L0,18 L-25,40 Z" fill="url(#boot-arrowDark)" />
            </g>
            <g fill="url(#boot-ring)">
              <path d="M120,11 L127,28 L120,45 L113,28 Z" /><path d="M229,120 L212,127 L195,120 L212,113 Z" />
              <path d="M120,229 L113,212 L120,195 L127,212 Z" /><path d="M11,120 L28,113 L45,120 L28,127 Z" />
            </g>
            <text x="120" y="39" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#F5EEFF" text-anchor="middle">N</text>
          </g>
        </svg>
        <p class="loading-label">Starting up…</p>
      </main>
    </div>
  </body>
