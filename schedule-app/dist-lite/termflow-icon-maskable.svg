<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TermFlow">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241046"/><stop offset="1" stop-color="#0e0620"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#EBD9FF"/><stop offset="0.5" stop-color="#A855F7"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FBF8FF"/><stop offset="0.5" stop-color="#B98CF7"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="arrowDark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A77EE0"/><stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="flow" x1="0.2" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#5B21B6"/><stop offset="0.5" stop-color="#8B3DF5"/><stop offset="1" stop-color="#C77DFF"/>
    </linearGradient>
    <linearGradient id="flowHi" x1="0.2" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#8B3DF5"/><stop offset="1" stop-color="#E3C2FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <!-- full-bleed square: safe for maskable cropping -->
  <rect width="512" height="512" fill="url(#tile)"/>
  <ellipse cx="256" cy="268" rx="92" ry="112" fill="#8B3DF5" opacity="0.30" filter="url(#softglow)"/>
  <!-- mark in central safe zone (~64%) -->
  <g transform="translate(256,256) scale(0.66) translate(-120,-120)" filter="url(#glow)">
    <circle cx="120" cy="120" r="92" fill="none" stroke="url(#ring)" stroke-width="8"/>
    <g fill="url(#ring)">
      <path d="M120,11 L127,28 L120,45 L113,28 Z"/><path d="M229,120 L212,127 L195,120 L212,113 Z"/>
      <path d="M120,229 L113,212 L120,195 L127,212 Z"/><path d="M11,120 L28,113 L45,120 L28,127 Z"/>
    </g>
    <text x="120" y="39" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#F5EEFF" text-anchor="middle">N</text>
    <path fill="url(#flow)" d="M120,200 C 140,192 148,168 136,146 C 128,131 121,127 120,122 C 118,130 112,134 106,146 C 112,150 110,158 104,164 C 110,168 108,178 100,184 C 108,192 113,197 120,200 Z"/>
    <path fill="url(#flowHi)" d="M120,194 C 132,188 137,170 129,154 C 124,143 120,138 120,134 C 117,142 112,148 110,158 C 107,170 110,186 120,194 Z"/>
    <g transform="translate(118,100) rotate(42)">
      <path d="M0,-50 L25,40 L0,18 L-25,40 Z" fill="url(#arrow)"/>
      <path d="M0,-50 L0,18 L-25,40 Z" fill="url(#arrowDark)"/>
    </g>
  </g>
</svg>
