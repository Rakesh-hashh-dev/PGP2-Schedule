<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — TermFlow</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/termflow-icon.svg" />
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; background: #0e0f1a; color: #e4e0f4; text-align: center; }
      .logo-wrap { position: relative; width: 72px; height: 72px; }
      .logo-ring { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #4c3a7a; animation: pulse 2.8s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { .logo-ring { animation: none; } }
      img.logo { position: absolute; inset: 12px; width: 48px; height: 48px; }
      h1 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 800; letter-spacing: -0.04em; color: #f0ecff; }
      p { max-width: 340px; color: #9b97b8; font-size: 0.95rem; line-height: 1.65; }
      .status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: #1e1a30; border: 1px solid #332d52; font-size: 0.82rem; color: #9b97b8; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; flex-shrink: 0; }
      .dot.online { background: #4ade80; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 11px 22px; border-radius: 999px; background: #6d28d9; color: #fff; font-size: 0.9rem; font-weight: 700; text-decoration: none; border: none; cursor: pointer; transition: background 0.18s, transform 0.18s; }
      .btn:hover { background: #7c3aed; transform: translateY(-1px); }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
      small { color: #6b6882; font-size: 0.78rem; }
    </style>
  </head>
  <body>
    <div class="logo-wrap">
      <div class="logo-ring" aria-hidden="true"></div>
      <img class="logo" src="/termflow-icon.svg" alt="TermFlow" width="48" height="48" />
    </div>

    <div>
      <h1>You're offline</h1>
    </div>

    <p id="status-msg">
      Your cached schedule is loading — if you've visited before, TermFlow works offline.
    </p>

    <div class="status" id="conn-status" role="status" aria-live="polite">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-label">Checking connection…</span>
    </div>

    <button class="btn" id="retry-btn" onclick="tryReload()">Try again</button>

    <small>TermFlow — IIM Sambalpur PGP2</small>

    <script>
      function updateUI() {
        const online = navigator.onLine;
        document.getElementById('conn-dot').className = 'dot' + (online ? ' online' : '');
        document.getElementById('conn-label').textContent = online ? 'Connection restored — reloading…' : 'No internet connection';
        if (online) setTimeout(() => location.reload(), 800);
      }

      function tryReload() {
        const btn = document.getElementById('retry-btn');
        btn.textContent = 'Checking…';
        btn.disabled = true;
        fetch('/', { method: 'HEAD', cache: 'no-store' })
          .then(() => location.reload())
          .catch(() => {
            btn.textContent = 'Still offline — try again';
            btn.disabled = false;
          });
      }

      updateUI();
      window.addEventListener('online', updateUI);
      window.addEventListener('offline', updateUI);
    </script>
  </body>
</html>
