<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Legacy-domain guard: the old pgp2-schedule.vercel.app link was shared before
         the custom domain existed. Clerk PROD keys only initialize on pgp2.termflow.tech,
         so on the vercel.app host the app hangs at "Starting up…". Bounce to the real
         domain before any app/Clerk code runs. (Also backstopped by a vercel.json redirect
         for fresh loads; this covers service-worker-cached loads.) -->
    <script>
      if (location.hostname === "pgp2-schedule.vercel.app") {
        location.replace("https://pgp2.termflow.tech" + location.pathname + location.search + location.hash);
      }
    </script>
    <meta name="google-site-verification" content="-n0rF29JoTYnculv2rShozCYa_YAszuv3ak-58v3PBY" />

    <!-- Theme init: must run before first paint so a saved dark preference
         never flashes the light UI. Mirrors useTheme() in App.jsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pgp2.theme");
          var dark = t === "dark" || ((t === "system" || !t) && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.dataset.theme = "dark";
        } catch (e) { /* no-op */ }
      })();
    </script>

    <!-- Preconnect to external origins to reduce latency. Clerk serves both a
         classic script (clerk-js) and CORS API calls (environment/client); the
         browser pools those connections separately, so warm both with a plain
         and a crossorigin preconnect. -->
    <link rel="preconnect" href="https://clerk.pgp2.termflow.tech" />
    <link rel="preconnect" href="https://clerk.pgp2.termflow.tech" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Async (non-blocking) Google Fonts load -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" onload="this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" /></noscript>
    <!-- All supabase-js traffic is CORS fetch, so the preconnect must be crossorigin
         to actually warm the connection the API calls reuse. -->
    <link rel="preconnect" href="https://fzhfbttlbfpnwhempyav.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://api.open-meteo.com" />
    <link rel="dns-prefetch" href="https://script.google.com" />

    <!-- Preload today's hero backdrop (must mirror HeroBackdrop's even/odd-day
         swap logic in Hero.jsx) so it paints with the hero instead of after it -->
    <script>
      (function () {
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        // Hero backdrop is the LCP element; hint the browser to fetch it early.
        l.fetchPriority = "high";
        l.href = new Date().getDate() % 2 === 0
          ? "/premium_hero_backdrop_v2.webp"
          : "/premium_hero_backdrop_v3.webp";
        document.head.appendChild(l);
      })();
    </script>

    <!-- Eager Schedule Fetch (LCP Optimization)
         Kicks off the network request for the schedule before React parses. -->
    <script>
      (function() {
        const FEED_URL = "https://script.google.com/macros/s/AKfycbwOCmpZAbzN7hRkb-xx6-SDejt3c45E5NBZ0NHuJW8CBRYO4ROJfwE_MI_g4aODwo08Gg/exec";
        try {
          const cached = JSON.parse(localStorage.getItem("pgp2-feed-cache") || "null");
          let url = FEED_URL;
          if (cached && cached.data && cached.data.buildTs) {
            url += "?since=" + cached.data.buildTs;
          }
          // Store the promise on window so sheet.js can await it
          window.__schedulePromise = fetch(url, { redirect: "follow" }).then(r => r.json()).catch(() => null);
        } catch(e) {}
      })();
    </script>

  <body>
    <!-- Static boot splash: painted straight from HTML so FCP doesn't wait on
         react-vendor + main.js. React's first render() replaces it (the
         Suspense fallback in main.jsx shows the animated TermFlowLoader).
         Uses .loading-screen/.loading-label from the render-blocking CSS in
         prod builds; the inline layout styles keep it centered in dev. -->
    <div id="root">
      <main class="loading-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh">
        <svg width="96" height="96" viewBox="0 0 240 240" role="img" aria-label="Loading…" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="boot-ring" x1="0" y1="0" x2="0.3" y2="1">
              <stop offset="0" stop-color="#EBD9FF" /><stop offset="0.5" stop-color="#A855F7" /><stop offset="1" stop-color="#6D28D9" />
            </linearGradient>
            <linearGradient id="boot-arrow" x1="0.1" y1="0" x2="0.9" y2="1">
              <stop offset="0" stop-color="#FBF8FF" /><stop offset="0.5" stop-color="#B98CF7" /><stop offset="1" stop-color="#7C3AED" />
            </linearGradient>
            <linearGradient id="boot-arrowDark" x1="0.1" y1="0" x2="0.9" y2="1">
              <stop offset="0" stop-color="#A77EE0" /><stop offset="1" stop-color="#4C1D95" />
            </linearGradient>
            <linearGradient id="boot-flow" x1="0.2" y1="0" x2="0.45" y2="1">
              <stop offset="0" stop-color="#5B21B6" /><stop offset="0.5" stop-color="#8B3DF5" /><stop offset="1" stop-color="#C77DFF" />
            </linearGradient>
            <linearGradient id="boot-flowHi" x1="0.2" y1="0" x2="0.45" y2="1">
              <stop offset="0" stop-color="#8B3DF5" /><stop offset="1" stop-color="#E3C2FF" />
            </linearGradient>
          </defs>
          <style>
            .boot-mark { transform-box: view-box; transform-origin: 120px 120px; animation: boot-breathe 2.6s ease-in-out infinite; }
            @keyframes boot-breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.028) } }
            @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; } }
          </style>
          <ellipse cx="120" cy="128" rx="55" ry="66" fill="#8B3DF5" opacity="0.24" />
          <g class="boot-mark">
            <circle cx="120" cy="120" r="92" fill="none" stroke="url(#boot-ring)" stroke-width="7" />
            <path fill="url(#boot-flow)" d="M120,200 C 140,192 148,168 136,146 C 128,131 121,127 120,122 C 118,130 112,134 106,146 C 112,150 110,158 104,164 C 110,168 108,178 100,184 C 108,192 113,197 120,200 Z" />
            <path fill="url(#boot-flowHi)" d="M120,194 C 132,188 137,170 129,154 C 124,143 120,138 120,134 C 117,142 112,148 110,158 C 107,170 110,186 120,194 Z" />
            <g transform="translate(118,100) rotate(42)">
              <path d="M0,-50 L25,40 L0,18 L-25,40 Z" fill="url(#boot-arrow)" />
              <path d="M0,-50 L0,18 L-25,40 Z" fill="url(#boot-arrowDark)" />
            </g>
            <g fill="url(#boot-ring)">
              <path d="M120,11 L127,28 L120,45 L113,28 Z" /><path d="M229,120 L212,127 L195,120 L212,113 Z" />
              <path d="M120,229 L113,212 L120,195 L127,212 Z" /><path d="M11,120 L28,113 L45,120 L28,127 Z" />
            </g>
            <text x="120" y="39" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#F5EEFF" text-anchor="middle">N</text>
          </g>
        </svg>
        <p class="loading-label" id="boot-greeting">Welcome to TermFlow</p>
        <p class="loading-sub">Getting your day ready…</p>
        <script>
          try {
            const cachedName = (localStorage.getItem("pgp2.startup-name") || "").trim().split(/\s+/)[0].slice(0, 40);
            if (cachedName) {
              const hour = new Date().getHours();
              const greeting = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
              document.getElementById("boot-greeting").textContent = greeting + ", " + cachedName;
            }
          } catch { /* Keep the generic welcome when storage is unavailable. */ }
        </script>
      </main>

    <script type="module" src="/src/main.jsx"></script>
