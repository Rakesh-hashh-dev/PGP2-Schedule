<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TermFlow Concept 4 - Apex Zenith">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tf-bg-4" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#20133c"/>
      <stop offset="50%" stop-color="#110924"/>
      <stop offset="100%" stop-color="#070312"/>
    </linearGradient>

    <!-- Facet 1: Top Light Spear (White -> Lavender -> Bright Violet) -->
    <linearGradient id="tf-facet-light-4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Facet 2: Top Shadow Spear (Dark Violet -> Deep Indigo) -->
    <linearGradient id="tf-facet-dark-4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="60%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Facet 3: Horizontal Wing Right (Electric Purple -> Royal Blue) -->
    <linearGradient id="tf-wing-right-4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Facet 4: Horizontal Wing Left Shadow -->
    <linearGradient id="tf-wing-left-4" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Facet 5: Bottom Anchor Stem -->
    <linearGradient id="tf-stem-4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Ambient Core Blur -->
    <filter id="tf-ambient-4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>

    <!-- Element Glow -->
    <filter id="tf-glow-4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="256" height="256" rx="58" fill="url(#tf-bg-4)"/>
  <rect width="254" height="254" x="1" y="1" rx="57" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Core Radiant Glow -->
  <circle cx="128" cy="128" r="76" fill="#A855F7" opacity="0.30" filter="url(#tf-ambient-4)"/>

  <!-- Prism Zenith Crest Group -->
  <g transform="translate(128, 128)" filter="url(#tf-glow-4)">
    <!-- North Point (Ascending Arrow Tip / Zenith Point) -->
    <polygon points="0,-74 34,-18 0,4" fill="url(#tf-facet-light-4)"/>
    <polygon points="0,-74 0,4 -34,-18" fill="url(#tf-facet-dark-4)"/>
    <line x1="0" y1="-74" x2="0" y2="4" stroke="#FFFFFF" stroke-width="1.4" opacity="0.9"/>

    <!-- East Wing (Forming right branch of stylized 'T' crest) -->
    <polygon points="34,-18 68,8 16,24 0,4" fill="url(#tf-wing-right-4)"/>
    <polygon points="16,24 68,8 44,22" fill="#38BDF8" opacity="0.7"/>

    <!-- West Wing (Forming left shadow branch of stylized 'T' crest) -->
    <polygon points="-34,-18 0,4 -16,24 -68,8" fill="url(#tf-wing-left-4)"/>
    <polygon points="-16,24 -68,8 -44,22" fill="#1E1B4B" opacity="0.9"/>

    <!-- South Anchor / Base Stem (Completing the central vertical of the 'T') -->
    <polygon points="0,4 16,24 0,72" fill="url(#tf-stem-4)"/>
    <polygon points="0,4 0,72 -16,24" fill="#3B0764"/>
    <line x1="0" y1="4" x2="0" y2="72" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>

    <!-- Central Diamond Brilliance Spark -->
    <polygon points="0,-6 6,4 0,14 -6,4" fill="#FFFFFF"/>
    <circle cx="0" cy="4" r="7" fill="#38BDF8" opacity="0.4"/>
  </g>
</svg>
