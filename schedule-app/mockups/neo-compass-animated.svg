<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TermFlow Neo-Compass Animated">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tf-bg-anim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1e0e3b"/>
      <stop offset="45%" stop-color="#110724"/>
      <stop offset="100%" stop-color="#06020e"/>
    </linearGradient>

    <!-- Dial Ring Gradient -->
    <linearGradient id="tf-ring-anim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="30%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Trail Gradient -->
    <linearGradient id="tf-trail-anim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#C084FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="1"/>
    </linearGradient>

    <!-- Arrow Light Facet -->
    <linearGradient id="tf-arrow-l-anim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F3E8FF"/>
      <stop offset="75%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Arrow Shadow Facet -->
    <linearGradient id="tf-arrow-d-anim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <filter id="tf-core-glow-anim" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>

    <filter id="tf-spec-glow-anim" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tf-sparkle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .nc-ambient {
        animation: nc-pulse 3.6s ease-in-out infinite;
        transform-origin: 128px 128px;
      }
      .nc-needle {
        animation: nc-settle 4s ease-in-out infinite;
        transform-origin: 16px -16px;
      }
      .nc-comet-orbit {
        animation: nc-spin 3s linear infinite;
        transform-origin: 128px 128px;
      }
      .nc-spark-pivot {
        animation: nc-spark 2.4s ease-in-out infinite;
        transform-origin: 16px -6px;
      }
      .nc-trail {
        animation: nc-wave 3.6s ease-in-out infinite alternate;
      }

      @keyframes nc-pulse {
        0%, 100% { opacity: 0.24; transform: scale(0.96); }
        50% { opacity: 0.44; transform: scale(1.08); }
      }

      @keyframes nc-settle {
        0%, 100% { transform: translate(16px, -16px) rotate(42deg); }
        35% { transform: translate(16px, -16px) rotate(45.5deg); }
        70% { transform: translate(16px, -16px) rotate(39.5deg); }
      }

      @keyframes nc-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes nc-spark {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.25); filter: drop-shadow(0 0 6px #38BDF8); }
      }

      @keyframes nc-wave {
        0% { stroke-dashoffset: 0; opacity: 0.85; }
        100% { stroke-dashoffset: 12; opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .nc-ambient, .nc-needle, .nc-comet-orbit, .nc-spark-pivot, .nc-trail {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="256" height="256" rx="58" fill="url(#tf-bg-anim)"/>
  <rect width="254" height="254" x="1" y="1" rx="57" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>

  <!-- Core Radiant Atmosphere Glow -->
  <circle class="nc-ambient" cx="128" cy="128" r="76" fill="#8B5CF6" filter="url(#tf-core-glow-anim)"/>

  <!-- Dial & Compass Elements -->
  <g transform="translate(128, 128)" filter="url(#tf-spec-glow-anim)">
    <!-- Outer Precision Calibrated Track -->
    <circle r="76" fill="none" stroke="url(#tf-ring-anim)" stroke-width="4.5"
            stroke-dasharray="98 8 20 8 98 8 20 8" opacity="0.95"/>

    <!-- Subtle Orbit Micro-Ticks -->
    <circle r="60" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" stroke-dasharray="3 6"/>

    <!-- 4 Cardinal Directional Jewels -->
    <circle cx="0" cy="-76" r="4.5" fill="#FFFFFF"/>
    <circle cx="0" cy="-76" r="8" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="76" cy="0" r="3.5" fill="#38BDF8"/>
    <circle cx="0" cy="76" r="3.5" fill="#8B5CF6"/>
    <circle cx="-76" cy="0" r="3.5" fill="#C084FC"/>

    <!-- Supersonic Fluid Momentum Stream -->
    <path class="nc-trail" d="M -54,54 C -22,66 24,46 26,-2 C 28,-36 6,-54 -16,-42 C -32,-30 -24,-6 8,10 C 38,26 54,-10 62,-36"
          fill="none" stroke="url(#tf-trail-anim)" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="240"/>

    <!-- 3D Chiseled Directional Needle with Magnetic Settling Animation -->
    <g class="nc-needle" transform="translate(16, -16) rotate(42)">
      <!-- Light Beveled Right Facet -->
      <polygon points="0,-56 22,26 0,10" fill="url(#tf-arrow-l-anim)"/>
      <!-- Shadowed Left Facet -->
      <polygon points="0,-56 0,10 -22,26" fill="url(#tf-arrow-d-anim)"/>
      <!-- Facet Center Specular Line -->
      <line x1="0" y1="-56" x2="0" y2="10" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>
    </g>

    <!-- Central Gyroscopic Pivot Spark -->
    <circle class="nc-spark-pivot" cx="16" cy="-6" r="4.5" fill="#FFFFFF"/>
    <circle cx="16" cy="-6" r="8.5" fill="#38BDF8" opacity="0.4"/>
  </g>

  <!-- Orbital Comet Particle that glides around the dial -->
  <g class="nc-comet-orbit">
    <circle cx="128" cy="52" r="4" fill="#FFFFFF" filter="url(#tf-sparkle-glow)"/>
    <circle cx="128" cy="52" r="2" fill="#E0F2FE"/>
    <!-- Comet tail -->
    <path d="M 128,52 A 76,76 0 0 0 102,57" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
