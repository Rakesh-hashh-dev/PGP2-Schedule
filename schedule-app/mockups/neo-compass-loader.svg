<svg viewBox="0 0 256 256" width="256" height="256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TermFlow Neo-Compass Indeterminate Loader">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tf-loader-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1e0e3b"/>
      <stop offset="50%" stop-color="#100622"/>
      <stop offset="100%" stop-color="#06020e"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="tf-loader-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Fast Trail Gradient -->
    <linearGradient id="tf-loader-trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0"/>
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="tf-arrow-l-ldr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="tf-arrow-d-ldr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <filter id="tf-ldr-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .spin-dial {
        animation: dial-rotation 1.5s linear infinite;
        transform-origin: 128px 128px;
      }
      .spin-trail {
        animation: trail-sweep 1.2s ease-in-out infinite alternate;
        transform-origin: 128px 128px;
      }
      .loader-needle {
        animation: needle-pulse 1.5s ease-in-out infinite;
        transform-origin: 128px 128px;
      }
      .ambient-glow {
        animation: amb-breathe 1.5s ease-in-out infinite;
        transform-origin: 128px 128px;
      }

      @keyframes dial-rotation {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes trail-sweep {
        0% { stroke-dashoffset: 60; opacity: 0.6; transform: scale(0.97); }
        100% { stroke-dashoffset: 0; opacity: 1; transform: scale(1.03); }
      }

      @keyframes needle-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }

      @keyframes amb-breathe {
        0%, 100% { opacity: 0.25; transform: scale(0.9); }
        50% { opacity: 0.55; transform: scale(1.1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .spin-dial, .spin-trail, .loader-needle, .ambient-glow {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="256" height="256" rx="58" fill="url(#tf-loader-bg)"/>
  <rect width="254" height="254" x="1" y="1" rx="57" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Core Radiant Glow -->
  <circle class="ambient-glow" cx="128" cy="128" r="74" fill="#8B5CF6" filter="url(#tf-ldr-glow)"/>

  <!-- Rotating Dial Ring -->
  <g class="spin-dial">
    <circle cx="128" cy="128" r="76" fill="none" stroke="url(#tf-loader-ring)" stroke-width="4.5"
            stroke-dasharray="80 16 35 16 80 16 35 16" stroke-linecap="round"/>
    <circle cx="128" cy="52" r="4.5" fill="#FFFFFF"/>
    <circle cx="204" cy="128" r="3.5" fill="#38BDF8"/>
    <circle cx="128" cy="204" r="3.5" fill="#8B5CF6"/>
    <circle cx="52" cy="128" r="3.5" fill="#C084FC"/>
  </g>

  <!-- Pulsing Central Gyro & Needle -->
  <g class="loader-needle" filter="url(#tf-ldr-glow)">
    <!-- Sweeping Fluid Wave -->
    <g transform="translate(128, 128)">
      <path class="spin-trail" d="M -54,54 C -22,66 24,46 26,-2 C 28,-36 6,-54 -16,-42 C -32,-30 -24,-6 8,10 C 38,26 54,-10 62,-36"
            fill="none" stroke="url(#tf-loader-trail)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="240"/>

      <!-- 42° Directional Arrow -->
      <g transform="translate(16, -16) rotate(42)">
        <polygon points="0,-56 22,26 0,10" fill="url(#tf-arrow-l-ldr)"/>
        <polygon points="0,-56 0,10 -22,26" fill="url(#tf-arrow-d-ldr)"/>
        <line x1="0" y1="-56" x2="0" y2="10" stroke="#FFFFFF" stroke-width="1.2" opacity="0.95"/>
      </g>

      <circle cx="16" cy="-6" r="4.5" fill="#FFFFFF"/>
      <circle cx="16" cy="-6" r="8.5" fill="#38BDF8" opacity="0.5"/>
    </g>
  </g>
</svg>
