<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="Segoe UI, Roboto, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a2e"/>
      <stop offset="1" stop-color="#0d0f1c"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#5b4bc4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="860" height="560" fill="url(#bg)"/>
  <text x="430" y="52" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">Class Reminder — how it appears on a phone (lock screen / notification shade)</text>
  <text x="430" y="76" text-anchor="middle" fill="#8a8fa8" font-size="13">Sent automatically ~30 minutes before each of the student's own classes</text>

  <!-- ══ Notification 1: regular class ══ -->
  <g filter="url(#shadow)">
    <rect x="90" y="110" width="680" height="150" rx="22" fill="#242838"/>
  </g>
  <!-- app icon -->
  <rect x="118" y="138" width="46" height="46" rx="12" fill="url(#icon)"/>
  <text x="141" y="169" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="800">TF</text>
  <!-- header row -->
  <text x="182" y="152" fill="#a6abc4" font-size="13" font-weight="600">TermFlow</text>
  <text x="256" y="152" fill="#6d7290" font-size="13">· now</text>
  <!-- title -->
  <text x="182" y="181" fill="#ffffff" font-size="17.5" font-weight="700">⏰ FPWM starts in 30 minutes</text>
  <!-- body -->
  <text x="182" y="207" fill="#b9bed6" font-size="14.5">10:00 – 11:30  ·  Room A01  ·  Section A</text>
  <text x="182" y="230" fill="#8a8fa8" font-size="13.5">Financial Planning and Wealth Management</text>
  <!-- chevron -->
  <text x="742" y="158" fill="#6d7290" font-size="14" text-anchor="end">⌄</text>

  <!-- ══ Notification 2: guest session variant ══ -->
  <g filter="url(#shadow)">
    <rect x="90" y="290" width="680" height="150" rx="22" fill="#242838"/>
  </g>
  <rect x="118" y="318" width="46" height="46" rx="12" fill="url(#icon)"/>
  <text x="141" y="349" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="800">TF</text>
  <text x="182" y="332" fill="#a6abc4" font-size="13" font-weight="600">TermFlow</text>
  <text x="256" y="332" fill="#6d7290" font-size="13">· now</text>
  <text x="182" y="361" fill="#ffffff" font-size="17.5" font-weight="700">🎓 Guest Session: GPP in 30 minutes</text>
  <text x="182" y="387" fill="#b9bed6" font-size="14.5">08:00 – 09:30  ·  Room A02  ·  All sections</text>
  <text x="182" y="410" fill="#8a8fa8" font-size="13.5">Game People Play — Prof. Shikha Bhardwaj</text>
  <text x="742" y="338" fill="#6d7290" font-size="14" text-anchor="end">⌄</text>

  <!-- ══ Behaviour notes ══ -->
  <text x="90" y="486" fill="#8a8fa8" font-size="13.5">•  Tapping opens TermFlow directly on the Today view</text>
  <text x="90" y="510" fill="#8a8fa8" font-size="13.5">•  Room / time reflect admin overrides — a cancelled class sends no reminder</text>
  <text x="90" y="534" fill="#8a8fa8" font-size="13.5">•  Works with screen locked or app closed (device needs internet)</text>
</svg>
