name: IndexNow ping
# Fires after every successful Vercel production deployment or manual trigger.
# Pings IndexNow so Bing (and Yandex) immediately re-crawl the updated pages.
# Google uses the sitemap + Search Console for its own indexing cycle.

on:
  deployment_status:
  workflow_dispatch:

jobs:
  ping:
    # Run on manual trigger OR successful production deployments
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"pgp2.termflow.tech\",
              \"key\": \"$INDEXNOW_KEY\",
              \"keyLocation\": \"https://pgp2.termflow.tech/$INDEXNOW_KEY.txt\",
              \"urlList\": [
                \"https://pgp2.termflow.tech/\",
                \"https://pgp2.termflow.tech/about.html\",
                \"https://pgp2.termflow.tech/changelog.html\",
                \"https://pgp2.termflow.tech/privacy.html\",
                \"https://pgp2.termflow.tech/terms.html\"
              ]
            }")
          echo "IndexNow returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 202 ]; then
            echo "IndexNow ping returned non-success code: $HTTP_CODE"
            exit 1
          fi
          echo "IndexNow ping successful!"
