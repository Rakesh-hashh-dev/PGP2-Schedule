name: Dispatch Scheduled Pushes

on:
  schedule:
    # Runs every 5 minutes (Note: GitHub Actions cron is approximate and may be delayed during peak times)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  dispatch-pushes:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/dispatch-scheduled-pushes" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "x-admin-key: ${{ secrets.PUSH_ADMIN_SECRET }}" \
            -d '{}'
