name: Dispatch Scheduled Pushes

on:
  schedule:
    # Runs every 5 minutes (Note: GitHub Actions cron is approximate and may be delayed during peak times)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  dispatch-pushes:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUSH_ADMIN_SECRET: ${{ secrets.PUSH_ADMIN_SECRET }}
        run: |
          curl -X POST "$SUPABASE_URL/functions/v1/dispatch-scheduled-pushes" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "x-admin-key: $PUSH_ADMIN_SECRET" \
            -d '{}'
