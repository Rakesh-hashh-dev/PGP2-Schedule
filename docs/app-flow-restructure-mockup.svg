  <!-- Social -->
  <circle cx="186" cy="692" r="3.4" fill="none" stroke="#8b81a6" stroke-width="1.5"/>
  <circle cx="194" cy="692" r="3.4" fill="none" stroke="#8b81a6" stroke-width="1.5"/>
  <path d="M181 700c0-2.5 2-4 5-4s5 1.5 5 4" stroke="#8b81a6" stroke-width="1.5" fill="none"/>
  <text x="190" y="717" class="mut" font-size="8.5" text-anchor="middle">Social</text>
  <!-- Inbox -->
  <path d="M241 690a4 4 0 018 0c0 4 1.5 5 1.5 5h-11s1.5-1 1.5-5z" fill="none" stroke="#8b81a6" stroke-width="1.5"/>
  <text x="245" y="717" class="mut" font-size="8.5" text-anchor="middle">Inbox</text>
  <!-- More -->
  <circle cx="296" cy="696" r="1.6" fill="#8b81a6"/><circle cx="302" cy="696" r="1.6" fill="#8b81a6"/><circle cx="308" cy="696" r="1.6" fill="#8b81a6"/>
  <text x="302" y="717" class="mut" font-size="8.5" text-anchor="middle">More</text>

  <text x="190" y="762" class="mut" font-size="11" text-anchor="middle">5 fixed dock slots · lens glides between hubs</text>

  <!-- ================= DESKTOP ================= -->
  <text x="400" y="128" class="tag">DESKTOP — same 5 hubs as sidebar groups</text>

  <!-- App window -->
  <rect x="400" y="140" width="800" height="600" rx="16" fill="url(#phone)" stroke="#3a2f52" stroke-width="2" filter="url(#soft)"/>

  <!-- Sidebar -->
  <rect x="400" y="140" width="210" height="600" rx="16" fill="#140f20"/>
  <rect x="595" y="140" width="15" height="600" fill="#140f20"/>
  <text x="430" y="184" class="h" font-size="16">TermFlow</text>

