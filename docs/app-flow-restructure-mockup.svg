    <text x="642" y="844" class="mut">notifications</text>
    <text x="642" y="857" class="mut">+ bell</text>

    <rect x="768" y="804" width="432" height="56" rx="10" fill="#191322" stroke="#332a4a"/>
    <text x="782" y="824" class="white" font-weight="700" font-size="12">More</text>
    <text x="782" y="844" class="mut">split · leave · wrapped · mess · preferences · admin</text>
    <text x="782" y="857" class="mut">(retires the mobile ⋯ overflow menu)</text>
