  <!-- active lens -->
  <rect x="60" y="680" width="48" height="40" rx="20" fill="url(#active)" opacity="0.9"/>
  <!-- Schedule -->
  <circle cx="84" cy="694" r="8.5" fill="none" stroke="#fff" stroke-width="1.6"/>
  <path d="M84 690v4l2.5 2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <text x="84" y="717" class="white" font-size="8.5" text-anchor="middle">Schedule</text>
  <!-- Academics -->
  <path d="M139 692l9 4-9 4-9-4z" fill="none" stroke="#8b81a6" stroke-width="1.5" stroke-linejoin="round"/>
