  <rect x="66" y="272" width="4" height="58" rx="2" fill="#6ee7b7"/>
  <text x="82" y="296" class="lbl" font-size="13" font-weight="600">Marketing Mgmt</text>
  <text x="82" y="315" class="mut" font-size="11">09:00 – 10:15 · Room 204</text>
  <text x="300" y="296" class="mut" font-size="11" text-anchor="end">now</text>

  <rect x="66" y="340" width="248" height="58" rx="12" fill="#1e1830" stroke="#2e2542" stroke-width="1"/>
  <rect x="66" y="340" width="4" height="58" rx="2" fill="#fdba74"/>
  <text x="82" y="364" class="lbl" font-size="13" font-weight="600">Financial Acct</text>
  <text x="82" y="383" class="mut" font-size="11">10:30 – 11:45 · Room 118</text>
  <text x="300" y="364" class="mut" font-size="11" text-anchor="end">in 45m</text>

  <rect x="66" y="408" width="248" height="58" rx="12" fill="#1a1428" stroke="#2a2140" stroke-width="1"/>
  <rect x="66" y="408" width="4" height="58" rx="2" fill="#c4b5fd"/>
  <text x="82" y="432" class="lbl" font-size="13" font-weight="600">Operations</text>
  <text x="82" y="451" class="mut" font-size="11">14:00 – 15:15 · Room 301</text>

  <!-- Bottom dock: 5 fixed slots -->
