  <!-- Inbox -->
  <path d="M436 399a4 4 0 018 0c0 4 1.5 5 1.5 5h-11s1.5-1 1.5-5z" fill="none" stroke="#8b81a6" stroke-width="1.5"/>
  <text x="460" y="410" class="lbl" font-size="13.5">Inbox</text>
  <circle cx="576" cy="401" r="8" fill="#e0554e"/><text x="576" y="405" class="white" font-size="10" text-anchor="middle" font-weight="700">3</text>
  <!-- More -->
  <circle cx="435" cy="461" r="1.7" fill="#8b81a6"/><circle cx="441" cy="461" r="1.7" fill="#8b81a6"/><circle cx="447" cy="461" r="1.7" fill="#8b81a6"/>
  <text x="460" y="466" class="lbl" font-size="13.5">More</text>

  <!-- profile at bottom -->
  <line x1="418" y1="668" x2="592" y2="668" stroke="#2a2140" stroke-width="1"/>
  <circle cx="438" cy="700" r="15" fill="url(#active)"/>
  <text x="438" y="705" class="white" font-size="12" text-anchor="middle" font-weight="700">RB</text>
  <text x="462" y="697" class="lbl" font-size="13">Rakesh B</text>
  <text x="462" y="713" class="mut" font-size="11">Admin</text>

  <!-- Main content: Schedule with date pivot -->
  <text x="640" y="188" class="h" font-size="20">Schedule</text>
  <rect x="640" y="204" width="330" height="36" rx="18" fill="#1a1428"/>
  <rect x="642" y="206" width="86" height="32" rx="16" fill="url(#active)"/>
  <text x="685" y="227" class="white" font-size="12.5" text-anchor="middle" font-weight="600">Today</text>
  <text x="770" y="227" class="mut" font-size="12.5" text-anchor="middle">Tomorrow</text>
  <text x="860" y="227" class="mut" font-size="12.5" text-anchor="middle">Week</text>
  <text x="935" y="227" class="mut" font-size="12.5" text-anchor="middle">Full</text>

  <!-- content cards -->
  <rect x="640" y="258" width="530" height="70" rx="12" fill="#1e1830" stroke="#2e2542"/>
  <rect x="640" y="258" width="5" height="70" rx="2.5" fill="#6ee7b7"/>
  <text x="662" y="286" class="lbl" font-size="14" font-weight="600">Marketing Management</text>
  <text x="662" y="308" class="mut" font-size="12">09:00 – 10:15 · Room 204 · Prof. Nair</text>
  <text x="1150" y="286" class="mut" font-size="12" text-anchor="end">now</text>

  <rect x="640" y="338" width="530" height="70" rx="12" fill="#1e1830" stroke="#2e2542"/>
  <rect x="640" y="338" width="5" height="70" rx="2.5" fill="#fdba74"/>
  <text x="662" y="366" class="lbl" font-size="14" font-weight="600">Financial Accounting</text>
  <text x="662" y="388" class="mut" font-size="12">10:30 – 11:45 · Room 118</text>
  <text x="1150" y="366" class="mut" font-size="12" text-anchor="end">in 45m</text>

  <!-- sub-nav note -->
  <text x="640" y="452" class="mut" font-size="12" font-style="italic">Today · Tomorrow · Week · Full-timetable are pivots inside one hub — not separate tabs</text>

  <!-- Hub-content chips showing what other hubs open -->
  <text x="640" y="500" class="tag">EACH HUB OPENS A SEGMENTED SUB-VIEW</text>
  <g font-size="11">
    <rect x="640" y="512" width="150" height="72" rx="10" fill="#191322" stroke="#2a2140"/>
    <text x="654" y="534" class="lbl" font-weight="600">Academics</text>
    <text x="654" y="554" class="mut">Attendance · Exams</text>
    <text x="654" y="570" class="mut">· Assignments</text>

    <rect x="806" y="512" width="150" height="72" rx="10" fill="#191322" stroke="#2a2140"/>
    <text x="820" y="534" class="lbl" font-weight="600">Social</text>
    <text x="820" y="554" class="mut">Friends · Board</text>
    <text x="820" y="570" class="mut">· Meetups</text>

    <rect x="972" y="512" width="150" height="72" rx="10" fill="#191322" stroke="#2a2140"/>
    <text x="986" y="534" class="lbl" font-weight="600">More</text>
    <text x="986" y="554" class="mut">Split · Leave · Wrapped</text>
    <text x="986" y="570" class="mut">· Mess · Prefs · Admin</text>
  </g>

  <!-- ================= MAPPING STRIP ================= -->
  <text x="40" y="792" class="tag">OLD → NEW MAPPING · view state values unchanged (compat)</text>
  <g font-size="11.5">
    <!-- Schedule -->
    <rect x="40" y="804" width="228" height="56" rx="10" fill="#191322" stroke="#332a4a"/>
    <text x="54" y="824" class="white" font-weight="700" font-size="12">Schedule</text>
    <text x="54" y="844" class="mut">today · tomorrow · week ·</text>
    <text x="54" y="857" class="mut">fullSchedule</text>

    <rect x="278" y="804" width="180" height="56" rx="10" fill="#191322" stroke="#332a4a"/>
    <text x="292" y="824" class="white" font-weight="700" font-size="12">Academics</text>
    <text x="292" y="844" class="mut">attendance · exams ·</text>
    <text x="292" y="857" class="mut">assignments</text>

    <rect x="468" y="804" width="150" height="56" rx="10" fill="#191322" stroke="#332a4a"/>
    <text x="482" y="824" class="white" font-weight="700" font-size="12">Social</text>
    <text x="482" y="844" class="mut">friends · board</text>

    <rect x="628" y="804" width="130" height="56" rx="10" fill="#191322" stroke="#332a4a"/>
