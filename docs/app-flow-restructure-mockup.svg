<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16121f"/>
      <stop offset="1" stop-color="#0d0917"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5bd0"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1728"/>
      <stop offset="1" stop-color="#120d1c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <style>
      .h  { fill:#f4f1fb; font-weight:700; }
      .sub{ fill:#a99fc4; }
      .lbl{ fill:#cfc7e6; }
      .mut{ fill:#7d7397; }
      .white{ fill:#fff; }
      .chip{ fill:#241c34; }
      .tag { fill:#7d7397; font-size:10px; letter-spacing:.5px; }
    </style>
  </defs>

  <rect width="1240" height="880" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="52" class="h" font-size="26">PGP2 · App Flow Restructure</text>
  <text x="40" y="76" class="sub" font-size="14">14 destinations → 5 hubs · one nav config · identical on mobile &amp; desktop</text>

  <!-- ================= MOBILE ================= -->
  <text x="40" y="128" class="tag">MOBILE</text>

  <!-- Phone frame -->
  <rect x="40" y="140" width="300" height="600" rx="34" fill="url(#phone)" stroke="#3a2f52" stroke-width="2" filter="url(#soft)"/>
  <rect x="152" y="156" width="76" height="7" rx="3.5" fill="#2c2440"/>

  <!-- Hub header (Schedule active) -->
  <text x="66" y="205" class="h" font-size="20">Schedule</text>
  <circle cx="300" cy="199" r="15" fill="#241c34"/>
  <path d="M294 199h12M300 193v12" stroke="#a99fc4" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Date pivot (segmented) -->
  <rect x="66" y="222" width="248" height="34" rx="17" fill="#1a1428"/>
  <rect x="68" y="224" width="66" height="30" rx="15" fill="url(#active)"/>
  <text x="101" y="244" class="white" font-size="12" text-anchor="middle" font-weight="600">Today</text>
  <text x="163" y="244" class="mut" font-size="12" text-anchor="middle">Tmrw</text>
  <text x="218" y="244" class="mut" font-size="12" text-anchor="middle">Week</text>
  <text x="283" y="244" class="mut" font-size="12" text-anchor="middle">Full</text>

  <!-- Sample class cards -->
