<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" font-family="Segoe UI, Roboto, -apple-system, sans-serif">
  <defs>
    <radialGradient id="glowL" cx="0.28" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#4c3a9e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4c3a9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.74" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#7b3aed4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7b3aed4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1c1730"/>
      <stop offset="0.5" stop-color="#120e22"/>
      <stop offset="1" stop-color="#0d0a1a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#a78bfa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7c5cf0" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#5b4bc4"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#6d5bd0"/>
    </linearGradient>
    <linearGradient id="titleA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab4ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="ctaGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#7c5cf0" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ambient background -->
  <rect width="920" height="640" fill="#0a0812"/>
  <rect width="920" height="640" fill="url(#glowL)"/>
  <rect width="920" height="640" fill="url(#glowR)"/>

  <!-- heading -->
  <text x="460" y="40" text-anchor="middle" font-size="21" font-weight="800">
    <tspan fill="#f0eefb">Class reminder on mobile — </tspan><tspan fill="url(#titleA)">Android (expanded)</tspan><tspan fill="#f0eefb"> and </tspan><tspan fill="#a78bfa">iOS lock screen</tspan>
  </text>

  <!-- ═══════════════ ANDROID ═══════════════ -->
  <g filter="url(#drop)">
    <rect x="96" y="68" width="336" height="516" rx="44" fill="url(#phone)"/>
    <rect x="96.75" y="68.75" width="334.5" height="514.5" rx="43.25" fill="none" stroke="url(#sheen)" stroke-width="1.5"/>
  </g>
  <!-- punch-hole camera -->
  <circle cx="264" cy="92" r="5" fill="#05040a"/>
  <!-- status bar -->
  <text x="122" y="99" fill="#b9bdd8" font-size="12.5" font-weight="600">9:30</text>
  <text x="406" y="99" fill="#b9bdd8" font-size="11" text-anchor="end">▲ 5G ▮</text>
  <!-- lock clock -->
  <text x="264" y="172" text-anchor="middle" fill="#efeefb" font-size="52" font-weight="200" letter-spacing="1">9:30</text>
  <text x="264" y="196" text-anchor="middle" fill="#8d92b3" font-size="13">Friday, 3 July</text>

  <!-- ── expanded notification card ── -->
  <g filter="url(#cardShadow)">
    <rect x="114" y="222" width="300" height="176" rx="24" fill="#221d3a"/>
    <rect x="114.5" y="222.5" width="299" height="175" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  </g>
  <!-- header: mini TF chip + app name + chevron -->
  <rect x="132" y="238" width="20" height="20" rx="6" fill="url(#icon)"/>
  <text x="142" y="252.5" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">TF</text>
  <text x="160" y="252.5" fill="#9aa0c2" font-size="11.5" font-weight="600">TermFlow · now</text>
  <text x="396" y="252" fill="#6d7294" font-size="12" text-anchor="end">⌃</text>

  <!-- clock glyph tile (the new context icon) -->
  <rect x="132" y="272" width="44" height="44" rx="12" fill="url(#icon)"/>
  <circle cx="154" cy="294" r="12.5" fill="none" stroke="#fff" stroke-width="3"/>
  <line x1="154" y1="294" x2="154" y2="286.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="154" y1="294" x2="160" y2="294" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <!-- title + body -->
  <text x="188" y="284" fill="#ffffff" font-size="14.5" font-weight="700">FPWM starts in 30 minutes</text>
  <text x="188" y="305" fill="#c6cade" font-size="11">🕙 10:00 – 11:30  📍 Room A01  👥 Sec A</text>
  <text x="188" y="324" fill="#8d92b3" font-size="11.5">Financial Planning and Wealth Management</text>

  <!-- gradient CTA -->
  <g filter="url(#ctaGlow)">
    <rect x="132" y="342" width="264" height="36" rx="18" fill="url(#cta)"/>
  </g>
  <text x="256" y="365" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Open TermFlow</text>
  <text x="380" y="365" fill="#e4defc" font-size="13" font-weight="700">›</text>

  <!-- ── collapsed second notification ── -->
  <g filter="url(#cardShadow)">
    <rect x="122" y="414" width="284" height="56" rx="20" fill="#1c1832" opacity="0.95"/>
    <rect x="122.5" y="414.5" width="283" height="55" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
  </g>
  <!-- bell glyph tile -->
  <rect x="138" y="428" width="28" height="28" rx="9" fill="url(#icon)"/>
  <path d="M152 434.5 c-3.6 0 -6 2.8 -6 6.5 v3.6 l-1.7 2.4 h15.4 l-1.7 -2.4 v-3.6 c0 -3.7 -2.4 -6.5 -6 -6.5 z" fill="#fff"/>
  <circle cx="152" cy="449.5" r="1.8" fill="#fff"/>
  <text x="176" y="438" fill="#9aa0c2" font-size="10.5" font-weight="600">TermFlow · 2h</text>
  <text x="176" y="456" fill="#e2e5f4" font-size="12" font-weight="600">🎓 Guest Session: GPP in 30 min</text>

  <!-- lock hint -->
  <circle cx="264" cy="520" r="16" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="259.5" y="517" width="9" height="8" rx="2" fill="none" stroke="#b9bdd8" stroke-width="1.6"/>
  <path d="M261 517 v-2.4 a3 3 0 0 1 6 0 v2.4" fill="none" stroke="#b9bdd8" stroke-width="1.6"/>
  <text x="264" y="556" text-anchor="middle" fill="#8d92b3" font-size="11.5">Swipe up to unlock</text>

  <text x="264" y="612" text-anchor="middle" font-size="13" font-weight="800">
    <tspan fill="url(#titleA)">ANDROID</tspan><tspan fill="#8d92b3" font-weight="600"> · Chrome / installed PWA</tspan>
  </text>

  <!-- ═══════════════ iOS ═══════════════ -->
  <g filter="url(#drop)">
    <rect x="488" y="68" width="336" height="516" rx="52" fill="url(#phone)"/>
    <rect x="488.75" y="68.75" width="334.5" height="514.5" rx="51.25" fill="none" stroke="url(#sheen)" stroke-width="1.5"/>
  </g>
  <!-- dynamic island -->
  <rect x="604" y="84" width="104" height="30" rx="15" fill="#05040a"/>
  <!-- status icons -->
  <text x="796" y="102" fill="#b9bdd8" font-size="11" text-anchor="end">▮▮ ⌔ ▭</text>
  <!-- lock clock -->
  <text x="656" y="196" text-anchor="middle" fill="#efeefb" font-size="62" font-weight="600" letter-spacing="1">9:30</text>
  <text x="656" y="222" text-anchor="middle" fill="#aab0cc" font-size="14">Friday 3 July</text>

  <!-- iOS notification (frosted) -->
  <g filter="url(#cardShadow)">
    <rect x="506" y="288" width="300" height="88" rx="24" fill="#3a3654" fill-opacity="0.72"/>
    <rect x="506.5" y="288.5" width="299" height="87" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>
  <!-- app icon (iOS always shows the app icon) -->
  <rect x="522" y="306" width="42" height="42" rx="11" fill="url(#icon)"/>
  <text x="543" y="333" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">TF</text>
  <!-- text -->
  <text x="578" y="316" fill="#ffffff" font-size="13" font-weight="700">⏰ FPWM starts in 30 minutes</text>
  <text x="578" y="335" fill="#e3e5f2" font-size="10.5">🕙 10:00 – 11:30  📍 Room A01  👥 Sec A</text>
  <text x="578" y="353" fill="#b6bad2" font-size="11">Financial Planning and Wealth Mgmt…</text>
  <text x="792" y="316" fill="#b6bad2" font-size="10" text-anchor="end">now</text>

  <!-- flashlight + camera -->
  <circle cx="540" cy="520" r="20" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="537" y="512.5" width="6" height="8" rx="1.5" fill="#dfe2f0"/>
  <rect x="538" y="520.5" width="4" height="7" rx="1.5" fill="#dfe2f0"/>
  <circle cx="772" cy="520" r="20" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="763" y="513.5" width="18" height="13" rx="3.5" fill="none" stroke="#dfe2f0" stroke-width="1.6"/>
  <circle cx="772" cy="520" r="3.4" fill="none" stroke="#dfe2f0" stroke-width="1.6"/>
  <text x="656" y="556" text-anchor="middle" fill="#8d92b3" font-size="11.5">Swipe up to open</text>
  <!-- home indicator -->
  <rect x="596" y="566" width="120" height="4.5" rx="2.25" fill="#e8eaf6" opacity="0.85"/>

  <text x="656" y="612" text-anchor="middle" font-size="13" font-weight="800">
    <tspan fill="#a78bfa">iOS</tspan><tspan fill="#8d92b3" font-weight="600"> · installed PWA (Safari)</tspan>
  </text>
</svg>
